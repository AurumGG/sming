<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gwyn Dorado Smart Streaming (GENIE)</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; padding: 20px; background-color: #f3f4f6; color: #111827; }
        .container { max-width: 950px; margin: 0 auto; background: white; padding: 35px; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.06); }
        h1 { text-align: center; color: #10b981; margin-bottom: 5px; }
        .desc { text-align: center; color: #4b5563; font-size: 0.95em; margin-bottom: 35px; line-height: 1.6; }
        .set-card { border: 1px solid #e5e7eb; border-radius: 20px; margin-bottom: 30px; background: #ffffff; box-shadow: 0 4px 14px rgba(0,0,0,0.03); }
        .set-header { background: #f8fafc; padding: 15px 25px; font-weight: bold; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; border-radius: 20px 20px 0 0; }
        .exposure-tag { background: #eef6ff; color: #2563eb; padding: 5px 14px; border-radius: 25px; font-size: 0.85em; }
        .module-container { display: flex; flex-wrap: wrap; gap: 15px; padding: 25px; justify-content: center; }
        .module-box { flex: 1; min-width: 200px; max-width: 260px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 15px; padding: 15px; text-align: center; }
        .btn { display: block; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 0.85em; margin-bottom: 8px; transition: 0.2s; color: white; text-align: center; }
        .btn-web { background-color: #10b981; }
        .btn-android { background-color: #111827; }
        .btn-ios { background-color: #2563eb; }
        .footer { margin-top: 50px; text-align: center; font-size: 0.85em; color: #94a3b8; border-top: 1px solid #f1f5f9; padding-top: 25px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <h1>Gwyn Dorado Streaming (GENIE)</h1>
    <p class="desc">
        <strong>시간 동기화 가변 엔진 (지니뮤직 전용)</strong><br>
        클릭 시 중복 곡이 포함된 총 18 트랙의 플레이리스트가 지니 앱에 그대로 담깁니다.<br>
        매번 새로고침할 때마다 완전히 새로운 규칙으로 리스트가 재생성됩니다.
    </p>

    <script>
        // =========================================================================
        // [데이터 설정 영역] 
        // 1. targetId: 추후 음원이 발매되면 발매된 타겟 곡의 고유 ID 숫자를 적어주세요.
        // 2. g1: 제공해주신 이미지 속 11개의 Song ID 목록입니다.
        // =========================================================================
        const targetId = "YOUR_TARGET_ID_HERE"; 
        const g1 = ["112807970", "113204604", "113265479", "111876440", "114452487", "109967000", "103604435", "113094114", "112316643", "112996079", "111876441"];
        
        // 총 18곡을 채우기 위한 기준점
        const TOTAL_TRACKS = 18; 

        // 각 세트별 타겟 곡의 진입 횟수 패턴 설정 (원하는 수치로 자유롭게 변경 가능)
        const exposurePatterns = [3, 4, 5, 6, 4, 3, 4, 5, 3, 4];

        // 배열 복사 및 무작위 셔플 함수
        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 패턴 배열의 길이에 맞게 가변적으로 세트 카드 생성
        for (let i = 0; i < exposurePatterns.length; i++) {
            let exposureCount = exposurePatterns[i]; 

            document.write(`
                <div class="set-card">
                    <div class="set-header">
                        <span>SET ${i + 1} (총 18트랙 고정 / 1-Hour Round)</span>
                        <span class="exposure-tag">타겟 곡 ${exposureCount}회 중복 노출</span>
                    </div>
                    <div class="module-container">`);

            for (let m = 0; m < exposureCount; m++) {
                let pool = [];
                
                // [정밀 보정]: 처음부터 18곡 공간 중 '타겟 곡이 들어갈 영역'을 뺀 나머지만큼 일반 곡을 뽑습니다.
                let normalSongCount = TOTAL_TRACKS - exposureCount; 

                // 1. 필요한 순수 일반 곡 개수만큼 채우기 (모자라면 중복 추출)
                let tempNormalSongs = shuffle(g1);
                for (let s = 0; s < normalSongCount; s++) {
                    if (tempNormalSongs.length === 0) {
                        tempNormalSongs = shuffle(g1); 
                    }
                    pool.push(tempNormalSongs.pop());
                }

                // 2. 지정된 할당량(exposureCount)만큼 타겟 곡 ID를 배열에 추가 (이제 정확히 총 18곡이 됩니다)
                for (let t = 0; t < exposureCount; t++) {
                    pool.push(targetId);
                }

                // 3. 전체 목록 무작위 대형 셔플
                pool = shuffle(pool);

                // 4. 안전장치: 맨 마지막 트랙이 타겟 곡일 경우, 완벽한 예외 처리를 위해 일반 곡이 나올 때까지 셔플을 반복하거나 위치 교환
                if (pool[pool.length - 1] === targetId) {
                    for (let s = 0; s < pool.length - 1; s++) {
                        if (pool[s] !== targetId) {
                            [pool[s], pool[pool.length - 1]] = [pool[pool.length - 1], pool[s]];
                            break;
                        }
                    }
                }

                // 지니 주소창 규격에 맞게 세미콜론(;)으로 곡 ID 연결
                let cid = pool.join(';');

                // 각 기기별 연동 주소 바인딩
                let webLink = `https://www.genie.co.kr/player/shareProcessV2?xgnm=${cid}`;
                let androidLink = `cromegenie://scan/?landing_type=31&landing_target=${cid}`;
                let iosLink = `ktolleh00167://landing/?landing_type=31&landing_target=${cid}`;

                document.write(`
                    <div class="module-box">
                        <strong>모듈 / Module ${m + 1}</strong><br><small>(${pool.length} Tracks)</small><br><br>
                        <a href="${webLink}" target="_blank" rel="noopener noreferrer" class="btn btn-web">Genie Web</a>
                        <a href="${androidLink}" class="btn btn-android">Android App</a>
                        <a href="${iosLink}" class="btn btn-ios">iPhone App</a>
                    </div>
                `);
            }
            document.write(`</div></div>`);
        }
    </script>

    <div class="footer">
        Target Allowed at Index 0 / Excluded at Last Track.<br>
        App buttons work only on supported devices with the Genie app installed.
    </div>
</div>

</body>
</html>
